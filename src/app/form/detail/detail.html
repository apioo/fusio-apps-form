
<h1>{{form()?.name}}</h1>

@if (!loading()) {
  @if (schema(); as schema) {
    <jsonforms
      [data]="initialData"
      [schema]="schema"
      [uischema]="uiSchema()!"
      [renderers]="renderers"
      (dataChange)="onDataChange($event)">
    </jsonforms>
  }

  <pre>{{ data()|json }}</pre>

}
@else {
  <div class="spinner-border" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
}
