
<h1>{{form()?.name}}</h1>

@if (!loading()) {
  @if (schema(); as schema) {
    <jsonforms
      [data]="initialData"
      [schema]="schema"
      [uischema]="uiSchema()!"
      [renderers]="renderers"
      (dataChange)="onDataChange($event)">
    </jsonforms>
    <fusio-form-button type="primary" [loading]="submitting()" title="Submit" titleLoading="Submitting ..." (onAction)="submitForm()"></fusio-form-button>
  }
  @if (response(); as resp) {
    <hr>
    <pre>{{ resp|json }}</pre>
  }
}
@else {
  <div class="spinner-border" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
}
